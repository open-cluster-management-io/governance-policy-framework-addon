apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  annotations:
    policy.open-cluster-management.io/managed-cluster-uid: framework-addon-e2e-uid-fence
  name: case10-template-name-error
  labels:
    policy.open-cluster-management.io/cluster-name: managed
    policy.open-cluster-management.io/cluster-namespace: managed
    policy.open-cluster-management.io/root-policy: case10-template-name-error
spec:
  remediationAction: inform
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          namespace: default
        spec:
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Pod
                metadata:
                  name: nginx-pod-e2e
                  namespace: default
                spec:
                  containers:
                    - name: nginx

